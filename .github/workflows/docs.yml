name: docs
on:
    push:
        branches:
            - master
permissions:
    contents: write
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install .
            - name: Run tests
              run: |
                  python -m unittest discover tests/
            - name: Install docs dependencies
              run: |
                  pip install mkdocs-material "mkdocstrings[python]" mkdocs-git-revision-date-plugin mkdocs-jupyter
            - name: Deploy docs
              run: mkdocs gh-deploy --force
